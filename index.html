<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Tracker</title>
<style>
body{margin:0;font-family:system-ui;background:#f4f6f8;color:#222}
header{background:#111827;color:white;text-align:center;padding:20px}
main{padding:16px;max-width:760px;margin:auto}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 4px 14px #0001}
textarea,input,select,button{width:100%;padding:12px;margin-top:8px;border-radius:12px;font-size:16px;box-sizing:border-box}
textarea{min-height:120px}
button{border:0;background:#2563eb;color:white;font-weight:bold}
.save{background:#16a34a}
.danger{background:#dc2626}
.status{background:#ecfeff;color:#155e75;padding:12px;border-radius:12px;margin-bottom:16px;font-weight:bold}
.line{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0}
.small{width:auto;padding:6px 10px;font-size:12px}
.memo{white-space:pre-wrap;background:#f8fafc;padding:12px;border-radius:12px;margin-top:12px}
.history{border:1px solid #ddd;border-radius:12px;margin-bottom:10px;overflow:hidden}
.history-head{background:#f1f5f9;padding:12px;font-weight:bold}
.history-body{padding:12px;display:none}
.open{display:block}
</style>
</head>

<body>
<header>
<h1>Workout Tracker</h1>
<p>予定メモ・実績入力・前回実績・履歴管理</p>
</header>

<main>
<div id="status" class="status">読み込み中...</div>

<section class="card">
<h2>今日の予定メモ</h2>
<textarea id="planInput" placeholder="5/23予定&#10;レッグプレス50×12×2"></textarea>
<button onclick="savePlan()">予定メモを保存</button>
<div id="planArea"></div>
</section>

<section class="card">
<h2>今日の実績入力</h2>

<label>日付</label>
<input type="date" id="dateInput">

<label>種目</label>
<select id="nameInput">
<option>トレッドミル</option>
<option>レッグプレス</option>
<option>チェストプレス</option>
<option>ラットプルダウン</option>
<option>アブダクション</option>
<option>アダクション</option>
<option>その他</option>
</select>

<input id="customName" placeholder="その他の種目名">

<label>重量・傾斜</label>
<input type="number" id="weightInput" inputmode="decimal">

<label>回数・速度</label>
<input type="number" id="repsInput" inputmode="decimal">

<label>セット・分</label>
<input type="number" id="setsInput" inputmode="numeric">

<button onclick="addExercise()">実績に追加</button>
<div id="currentArea"></div>

<button class="save" onclick="saveWorkout()">今日の実績を保存</button>
</section>

<section class="card">
<h2>直近の前回実績</h2>
<div id="lastArea"></div>
</section>

<section class="card">
<h2>履歴</h2>
<div id="historyArea"></div>
</section>

<section class="card">
<h2>データ管理</h2>
<button class="danger" onclick="clearAll()">全データ削除</button>
</section>
</main>

<script>
let workouts = JSON.parse(localStorage.getItem("workouts") || "[]");
let current = [];

document.addEventListener("DOMContentLoaded", function(){
  document.getElementById("dateInput").value = new Date().toISOString().slice(0,10);
  statusText("アプリを読み込みました");
  render();
});

function statusText(text){
  document.getElementById("status").textContent = text;
}

function savePlan(){
  const text = document.getElementById("planInput").value.trim();
  if(!text){ alert("予定メモを入力してください"); return; }
  localStorage.setItem("plan", text);
  document.getElementById("planInput").value = "";
  statusText("予定メモを保存しました");
  render();
}

function addExercise(){
  let name = document.getElementById("nameInput").value;
  const custom = document.getElementById("customName").value.trim();
  if(name === "その他" && custom) name = custom;

  const weight = document.getElementById("weightInput").value;
  const reps = document.getElementById("repsInput").value;
  const sets = document.getElementById("setsInput").value;

  if(!weight || !reps || !sets){
    alert("重量・回数・セットを入力してください");
    return;
  }

  current.push({name, weight, reps, sets});

  document.getElementById("weightInput").value = "";
  document.getElementById("repsInput").value = "";
  document.getElementById("setsInput").value = "";

  statusText("実績に追加しました");
  renderCurrent();
}

function saveWorkout(){
  if(current.length === 0){
    alert("先に実績に追加してください");
    return;
  }

  const d = document.getElementById("dateInput").value;
  const parts = d.split("-");
  const date = Number(parts[1]) + "/" + Number(parts[2]);

  workouts.push({date, exercises: current});
  localStorage.setItem("workouts", JSON.stringify(workouts));
  current = [];

  statusText("実績を保存しました");
  render();
}

function render(){
  renderPlan();
  renderCurrent();
  renderLast();
  renderHistory();
}

function renderPlan(){
  const text = localStorage.getItem("plan");
  document.getElementById("planArea").innerHTML = text
    ? '<div class="memo">' + escapeHtml(text) + '</div>'
    : '<p>まだ予定メモはありません。</p>';
}

function renderCurrent(){
  document.getElementById("currentArea").innerHTML = current.length
    ? current.map((ex,i)=>`
      <div class="line">
        <span>${ex.name} ${ex.weight}×${ex.reps}×${ex.sets}</span>
        <button class="small danger" onclick="removeCurrent(${i})">削除</button>
      </div>`).join("")
    : "<p>まだ実績が追加されていません。</p>";
}

function removeCurrent(i){
  current.splice(i,1);
  statusText("入力中の実績を削除しました");
  renderCurrent();
}

function renderLast(){
  const area = document.getElementById("lastArea");
  if(workouts.length === 0){
    area.innerHTML = "<p>まだ実績がありません。</p>";
    return;
  }

  const w = workouts[workouts.length - 1];
  area.innerHTML = `<strong>${w.date}</strong>` + w.exercises.map(ex =>
    `<div class="line"><span>${ex.name} ${ex.weight}×${ex.reps}×${ex.sets}</span></div>`
  ).join("");
}

function renderHistory(){
  const area = document.getElementById("historyArea");
  if(workouts.length === 0){
    area.innerHTML = "<p>まだ履歴がありません。</p>";
    return;
  }

  area.innerHTML = workouts.slice().reverse().map((w,ri)=>{
    const original = workouts.length - 1 - ri;
    return `
    <div class="history">
      <div class="history-head" onclick="toggleHistory(${ri})">${w.date}</div>
      <div class="history-body" id="h${ri}">
        ${w.exercises.map(ex =>
          `<div class="line"><span>${ex.name} ${ex.weight}×${ex.reps}×${ex.sets}</span></div>`
        ).join("")}
        <button class="danger" onclick="deleteWorkout(${original})">この日の実績を削除</button>
      </div>
    </div>`;
  }).join("");
}

function toggleHistory(i){
  document.getElementById("h"+i).classList.toggle("open");
}

function deleteWorkout(i){
  if(!confirm("削除しますか？")) return;
  workouts.splice(i,1);
  localStorage.setItem("workouts", JSON.stringify(workouts));
  statusText("実績を削除しました");
  render();
}

function clearAll(){
  if(!confirm("すべて削除しますか？")) return;
  workouts = [];
  current = [];
  localStorage.removeItem("workouts");
  localStorage.removeItem("plan");
  statusText("すべて削除しました");
  render();
}

function escapeHtml(text){
  return text.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}
</script>
</body>
</html>
